version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: student_db_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: student_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d student_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: student_api_container
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: student_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
